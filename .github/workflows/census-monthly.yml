name: Census trade monthly sync

# Census Bureau International Trade data: published with a 2-3 month lag.
# Running on the 15th of each month catches new releases promptly.
# A single run can take 5-10+ minutes per new month; usually only one new
# month is added per run.

on:
  schedule:
    # 13:00 UTC on the 15th of each month ≈ 8-9 AM ET.
    - cron: '0 13 15 * *'
  workflow_dispatch: {}

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60  # Census ingestion can take a while
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements.txt
      - run: python -m scripts.fetch_census_trade
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
