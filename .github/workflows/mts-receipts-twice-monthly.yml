name: MTS receipts twice-monthly sync

# Monthly Treasury Statement, full receipts breakdown (Table 4): individual
# income tax, corporate, payroll/social insurance, excise, customs duties,
# estate/gift, miscellaneous. Powers the Tariffs & Taxes page.
#
# Distinct from the existing `mts-twice-monthly.yml` workflow which pulls
# ONLY the Customs Duties line from Table 4 into mts_monthly. This one
# pulls all ~57 categories per month into federal_receipts. Same cadence
# (1st + 15th + 23rd), 12 minutes apart so the two don't compete for runners
# in the same scheduler load batch.

on:
  schedule:
    # 13:53 UTC on the 1st and 15th of each month ≈ 8:53 AM ET DST.
    # Off-hour minute (not 0) avoids the GitHub Actions top-of-hour
    # scheduling delay — see dts-weekday.yml. Minute differs from the
    # existing MTS workflow (13:41) so they spread across the hour.
    # Added 2026-10-21: the 23rd. September's MTS is the fiscal-year-end
    # "Final" statement and publishes LATER than a normal month — in 2026 it
    # landed between the 15th and the 21st, so the 15th run missed it and the
    # next run was Nov 1. The site showed August data for weeks. The 23rd
    # closes that gap with margin, including for the multi-hour scheduling
    # drift Actions can add.
    - cron: '53 13 1,15,23 * *'
  workflow_dispatch: {}

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: pip install -r requirements.txt
      - run: python -m scripts.fetch_mts_receipts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
